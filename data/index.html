<!DOCTYPE html>
<meta charset="UTF-8">
<title>ESP32-Scan</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  button { padding: .5rem 1rem; margin-right: .5rem; cursor: pointer; }
  #log { background: #111; color: #0f0; padding: 1rem; height: 250px; overflow-y: auto; border-radius: 4px; }
</style>

<h3>ESP32-Scan &mdash; 802.11</h3>
<button onclick="run('scan')">Scan</button>
<button onclick="run('deauth')">Deauth</button>
<button onclick="run('monitor')">Monitor</button>

<pre id="log"></pre>

<script>
function run(cmd) {
  log.textContent += new Date().toLocaleTimeString() + " > " + cmd + "\n";
}
</script>
