<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YK@ESP32:~</title>
    <style>
        /*variaveis globais CSS*/
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #111111;
            --text-main: #d4d4d4;
            --text-muted: #666666;
            --accent-red: #c50f1f;
            --accent-red-hover: #e01b2f;
            --border-color: #333333;
        }

        /* estrutura base*/
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /*box do painel*/
        .container {
            width: 100%;
            max-width: 800px;
            border: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        /* barra superior terminal */
        .header {
            background-color: var(--border-color);
            padding: 5px 10px;
            font-size: 0.9em;
            color: #aaaaaa;
            display: flex;
            justify-content: space-between;
        }

        /* espaçamento interno do box */
        .content {
            padding: 20px;
        }

        .sys-info {
            margin-bottom: 20px;
            color: var(--text-muted);
            font-size: 0.85em;
        }

        /*monitor de logs */
        .console-output {
            background-color: #000000;
            border: 1px solid var(--border-color);
            height: 250px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 20px;
            color: #cccccc;
        }

        .prompt {
            color: var(--accent-red);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span>YK@ESP32:~</span>
            <span>WLAN0: OFFLINE</span>
        </div>

        <div class="content">
            <div class="sys-info">
                Target Protocol: 802.11
            </div>

            <div class="console-output" id="console">
                <div><span class="prompt">root@auditor:~#</span> Inicializando módulos de rádio... OK</div>
                <div><span class="prompt">root@auditor:~#</span> Aguardando comandos...</div>
            </div>
            
            </div>
        </div>

</body>
</html>
