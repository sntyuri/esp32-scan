<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YK@ESP32:~</title>
    <style>
        /*variaveis globais CSS*/
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #111111;
            --text-main: #d4d4d4;
            --text-muted: #666666;
            --accent-red: #c50f1f;
            --accent-red-hover: #e01b2f;
            --border-color: #333333;
        }

        /* estrutura base*/
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /*box do painel*/
        .container {
            width: 100%;
            max-width: 800px;
            border: 1px solid var(--border-color);
            background-color: var(--panel-bg);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        </div>

</body>
